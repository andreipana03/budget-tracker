# Local development services. Start with `make db-up`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_tracker"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
