# Production stack: Postgres + one-shot migrations + Go API + Caddy (web app + HTTPS).
# Run from this folder:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: budget_tracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_tracker"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["/app/goose", "-dir", "/app/migrations", "postgres", "postgres://budget:${POSTGRES_PASSWORD}@postgres:5432/budget_tracker?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://budget:${POSTGRES_PASSWORD}@postgres:5432/budget_tracker?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      JOBS_ENABLED: "true"

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
